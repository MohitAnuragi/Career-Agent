name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://career:career@localhost:5432/career_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed   # default FASTEMBED_CACHE, relative to the checkout
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
